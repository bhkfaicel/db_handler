services:
  # InfluxDB service for tests
  influxdb:
    image: influxdb:2.7-alpine
    container_name: db_handler_influxdb_test
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123456
      - DOCKER_INFLUXDB_INIT_ORG=test-org
      - DOCKER_INFLUXDB_INIT_BUCKET=test_bucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=test-token-1234567890123456789012345678901234567890123456789012345678901234
    volumes:
      - influxdb_test_data:/var/lib/influxdb2
    healthcheck:
      # Check that port 8086 is responding
      test: ["CMD-SHELL", "nc -z localhost 8086 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - test-network

  # Service to run tests
  test-runner:
    build:
      context: ..
      dockerfile: db_handler/Dockerfile.test
      # No build args: the registry token is NOT passed through build args
      # (that would preserve the exposure in build metadata/provenance). The
      # canonical token path is the BuildKit secret below. For legacy
      # non-BuildKit runners, a human passes the Dockerfile ARG manually
      # (e.g. --build-arg) instead — see Dockerfile.test.
      secrets:
        # Ephemeral per-build secret mount; requires BuildKit (default on
        # Docker Engine 23+/Compose v2+).
        - forgejo_token
    container_name: db_handler_test_runner
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      # Test configuration is provided as JSON (InfluxDB URL/org/token are
      # read from this file, not from environment variables).
      - CONFIG_FILE=/app/db_handler/config.test.json
      - RUST_BACKTRACE=1
      - SQLX_OFFLINE=true
    volumes:
      # Cached cargo registry (image CARGO_HOME is /usr/local/cargo — the
      # Dockerfile's registry config and this mount target agree); the cached
      # registry and target-vol contents are owned by the image's non-root
      # user via directory inheritance, so the runtime user can write them.
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/db_handler/target
    working_dir: /app/db_handler
    networks:
      - test-network
    command: >
      sh -c "
        echo 'Waiting for InfluxDB to be ready...' &&
        sleep 5 &&
        echo 'Pass 1/2: standard gate (same as scripts/test.sh)...' &&
        cargo test --locked --features sensors,users,utoipaDoc -- --test-threads=1 &&
        cargo test --doc --locked --features sensors,users,utoipaDoc &&
        echo 'Pass 2/2: InfluxDB-backed ignored tests...' &&
        cargo test --locked --features sensors,users,utoipaDoc -- --run-ignored all --test-threads=1
      "

volumes:
  influxdb_test_data:
  cargo-cache:
  target-cache:

# Build-time-only secret (Forgejo registry token) sourced from the
# environment — the container runtime environment never sees it.
secrets:
  forgejo_token:
    environment: CARGO_REGISTRIES_FORGEJO_TOKEN

networks:
  test-network:
    driver: bridge
