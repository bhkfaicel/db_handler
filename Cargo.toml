[package]
name = "db_handler"
version = "0.3.2"
edition = "2021"
description = "Home IoT backend library: SQLite primary DB, InfluxDB history, sensors, users, keys"
repository = "https://code.bhk-itsolutions.com/homeiot/db_handler.git"
authors = ["Faicel <faicelbhk@gmail.com>"]
license-file = "LICENSE"
publish = ["forgejo", "forgejorc"]

[dependencies]
include_dir = "0.7"
bcrypt = "0.19.0"
# Argon2id password hashing (RustCrypto). `password-hash` brings the PHC
# string format; its `getrandom` feature activates `rand_core::OsRng` for
# unique per-hash salt generation from the OS CSPRNG.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
# SHA-256 for refresh-token hashing at rest (RustCrypto). No stdlib
# alternative exists for SHA-256, and hashing is never hand-rolled.
sha2 = "0.10"
utoipa = { version = "5.4.0", optional = true }
serde_json = "1.0.149"
serde = { version = "1.0.214", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["sqlite","chrono","macros","runtime-tokio"] }
anyhow = "1.0.102"
thiserror = "2.0.18"
log = "0.4.29"
chrono = {version = "0.4.44", features = ["serde"]}
tokio = { version = "1.50.0", features = ["rt","macros"] }
futures = "0.3.32"
# InfluxDB 2.x client (rustls for lighter, pure-Rust TLS)
influxdb2 = { version = "0.5", features = ["rustls"], default-features = false }
# Direct reqwest on the same 0.11.x line influxdb2 already resolves: the
# history client factory must name `reqwest::ClientBuilder` to attach
# connect/request timeouts. No features of its own (TLS comes from
# influxdb2's rustls activation of the shared reqwest build).
reqwest = { version = "0.11", default-features = false }
# URL parsing for the history DB transport policy (scheme + host check).
# Already in the dependency graph via reqwest/influxdb2; naming it as a
# direct dependency costs no new code and avoids hand-rolled URL handling.
url = "2"
db_derive = { version = "1.0.0", registry = "forgejorc" }

[features]
default = []
sensors = []
users = []
utoipaDoc = ["utoipa"]
