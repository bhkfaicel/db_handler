name: Rust crate checks (local, pinned)

on:
  workflow_call:
    inputs:
      enable_tag_check:
        type: boolean
        default: true
      test_command:
        type: string
        default: "bash scripts/test.sh"

jobs:
  checks:
    runs-on: docker
    container:
      image: code.bhk-itsolutions.com/homeiot/ci-rust-embedded:rust-1.97.0
    env:
      CARGO_REGISTRIES_FORGEJO_TOKEN: "Bearer ${{ secrets.RUNNER_TOKEN }}"
      CARGO_REGISTRIES_FORGEJORC_TOKEN: "Bearer ${{ secrets.RUNNER_TOKEN }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.RUNNER_TOKEN }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install SQLite build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint (production features)
        run: cargo clippy --locked --features sensors,users,utoipaDoc --all-targets -- -D warnings

      - name: Unused dependencies
        run: cargo machete

      - name: Dependency policy
        run: cargo deny check

      - name: Version sync
        run: bash scripts/check-version-sync.sh

      - name: Reject an already published version
        if: ${{ inputs.enable_tag_check }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "error: could not read Cargo.toml version" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "error: tag v${VERSION} already exists; bump Cargo.toml and CHANGELOG.md" >&2
            exit 1
          fi

      - name: Tests
        run: ${{ inputs.test_command }}
