# On push to `dev`: run checks, then create and push prerelease tag `vX.Y.Z-rc`.
# Implementation: faicel/central_ci create_tag_on_dev.yml
# Repository is auto-detected from github.repository (caller).
#
# Requires: RUNNER_TOKEN secret (PAT with read repo + push tags).
# test_command keeps the crate-specific gate (SQLite dev deps, features, serial tests).

name: Create tag on dev

on:
  push:
    branches:
      - dev

jobs:
  tag:
    uses: faicel/central_ci/.forgejo/workflows/create_tag_on_dev.yml@main
    with:
      enable_deny: true
      test_command: bash scripts/test.sh
      audit_ignore_advisories: RUSTSEC-2023-0071
    secrets:
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
