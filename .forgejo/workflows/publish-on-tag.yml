# On push of tag v*: run checks, then Forgejo release + cargo publish
# (forgejorc for *-rc* tags, forgejo for stable tags).
# Implementation: faicel/central_ci publish_on_tag.yml
# Repository is auto-detected from github.repository (caller).
#
# Requires: RUNNER_TOKEN secret (PAT with publish packages + create releases).
# test_command keeps the crate-specific gate (SQLite dev deps, features, serial tests).

name: Publish release on tag

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    uses: faicel/central_ci/.forgejo/workflows/publish_on_tag.yml@main
    with:
      enable_deny: true
      test_command: bash scripts/test.sh
      audit_ignore_advisories: RUSTSEC-2023-0071
    secrets:
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
