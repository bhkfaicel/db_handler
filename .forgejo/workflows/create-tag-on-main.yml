# On push to main: run checks, then create/push stable tag vX.Y.Z and ensure release/X.Y.
# Implementation: faicel/central_ci create_tag_on_main.yml
# Repository is auto-detected from github.repository (caller).
#
# Requires: RUNNER_TOKEN secret (PAT with read repo + push tags + push branches).
# test_command keeps the crate-specific gate (SQLite dev deps, features, serial tests).

name: Create tag on main

on:
  push:
    branches:
      - main

jobs:
  tag:
    uses: faicel/central_ci/.forgejo/workflows/create_tag_on_main.yml@main
    with:
      enable_deny: true
      test_command: bash scripts/test.sh
      audit_ignore_advisories: RUSTSEC-2023-0071
    secrets:
      RUNNER_TOKEN: ${{ secrets.RUNNER_TOKEN }}
